<!doctype html>
<!-- OG card source (P2-23). Render at exactly 1200x630 and save to public/og.png:
     npx playwright screenshot --viewport-size=1200,630 file://<abs path>/scripts/og.html og.png
     (run from _tools/shot so playwright resolves, or from any env with playwright).
     The composition reuses the site's Light tokens and both webfonts. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Inter";
    src: url("../public/fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Newsreader";
    src: url("../public/fonts/newsreader-latin-wght-normal.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  @font-face {
    font-family: "Newsreader";
    src: url("../public/fonts/newsreader-latin-wght-italic.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-style: italic;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f7f4ed;
    color: #211b10;
    font-family: "Inter", system-ui, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 56px 64px 48px;
  }
  .meta {
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
    font-size: 17px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #5c5342;
    display: flex;
    justify-content: space-between;
  }
  .hero { align-self: center; }
  .line1 {
    font-size: 88px;
    font-weight: 500;
    letter-spacing: -0.025em;
    line-height: 1.06;
  }
  .line2 {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic;
    font-size: 88px;
    font-weight: 470;
    letter-spacing: -0.02em;
    line-height: 1.08;
    color: #211b10;
  }
  .caret { color: #2547d0; font-style: normal; }
  .sub {
    margin-top: 34px;
    font-size: 24px;
    color: #5c5342;
    max-width: 46ch;
    line-height: 1.5;
  }
  .footer {
    border-top: 1px solid #ded7c4;
    padding-top: 22px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
    font-size: 16px;
    color: #5c5342;
    letter-spacing: 0.08em;
  }
  .mark { color: #2547d0; }
</style>
</head>
<body>
  <div class="meta"><span>research archive</span><span>§00 – §07</span></div>
  <div class="hero">
    <div class="line1">Retrieval-augmented generation,</div>
    <div class="line2">read at the level of <span class="caret">the ranking.▌</span></div>
    <div class="sub">RAG robustness · knowledge poisoning · LLM systems — a personal research index, computed live in the browser.</div>
  </div>
  <div class="footer"><span><span class="mark">▸</span> concordance</span><span>0 records fabricated</span></div>
</body>
</html>
