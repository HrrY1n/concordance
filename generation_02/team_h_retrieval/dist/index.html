    <!-- Theme: resolve before first paint (no FOUC). Same rules as src/lib/theme.ts -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("h-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : systemDark ? "dark" : "light";
          var root = document.documentElement;
          root.classList.toggle("dark", theme === "dark");
          root.style.colorScheme = theme;
        } catch (e) {
          /* no storage — system preference only */
        }
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121110" />
