<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offprint — Grounded answers, studied where they break.</title>
    <meta
      name="description"
      content="A research reader: retrieval-augmented generation, its robustness, and knowledge poisoning. Questions in progress, case records, and small offline instruments — no fabricated credentials."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Offprint" />
    <meta property="og:title" content="Offprint — Grounded answers, studied where they break." />
    <meta
      property="og:description"
      content="A research reader: questions in progress, case records, and small offline instruments for RAG robustness and knowledge poisoning."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:image" content="https://example.com/og.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Theme before first paint: no FOUC. system → light → dark, persisted. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem("offprint-theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var t =
            p === "light" || p === "dark"
              ? p
              : p === "system" || !p
                ? dark
                  ? "dark"
                  : "light"
                : "light";
          var d = document.documentElement;
          d.dataset.theme = t;
          d.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- JSON-LD: the site describes itself without inventing a person -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Offprint",
            "url": "https://example.com/",
            "description": "A research reader: retrieval-augmented generation, its robustness, and knowledge poisoning.",
            "inLanguage": "en"
          },
          {
            "@type": "ProfilePage",
            "url": "https://example.com/",
            "about": {
              "@type": "Person",
              "jobTitle": "Computer Science — Research × Engineering",
              "knowsAbout": [
                "Retrieval-Augmented Generation",
                "RAG Robustness",
                "Knowledge Poisoning",
                "AI Security",
                "LLM Systems",
                "Retrieval–Generation Interaction"
              ]
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Offprint is a small single-page app; without JavaScript only this notice is
      available. The content it renders is plain typed data in src/content/.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
